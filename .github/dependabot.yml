version: 2
updates:
  # Workflows pin actions by commit; updates move the pin and its version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "(chore) "
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "(chore) "
    groups:
      cargo:
        patterns: ["*"]

  # ESLint for the GNOME Shell extension.
  - package-ecosystem: "npm"
    directory: "/gnome-shell-extension"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "(chore) "
    groups:
      eslint:
        patterns: ["*"]
