[package]
name = "tw-platform"
description = "Linux desktop services for TypeWhisper: audio capture, global shortcuts, text insertion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
libpulse-binding.workspace = true
libpulse-simple-binding.workspace = true
ashpd = { version = "0.14.3", default-features = false, features = ["async-io", "global_shortcuts", "remote_desktop", "screencast", "clipboard"] }
async-channel = "2"
async-io = "2"
futures-util = "0.3"
wl-clipboard-rs = "0.9.5"
# The C library's gettext; glibc has it built in.
gettext-rs = { version = "0.8", features = ["gettext-system"] }
