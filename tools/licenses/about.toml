# cargo-about settings for the license notices of the Rust crates in
# packaging/licenses/, see tools/licenses/update-crate-licenses.sh.

# The licenses the crates may use. A crate with a choice gets the first one in
# this list that it offers.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# Only what the Linux builds compile in.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace's own crates are GPL-3.0-or-later, see LICENSE.
private = { ignore = true }
