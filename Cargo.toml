[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/TypeWhisper/typewhisper-linux"
rust-version = "1.95"
publish = false

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libpulse-binding = "2"
libpulse-simple-binding = "2"
tw-plugin-protocol = { path = "crates/tw-plugin-protocol" }
tw-plugin-host = { path = "crates/tw-plugin-host" }
tw-platform = { path = "crates/tw-platform" }
tw-openai-transcription = { path = "crates/tw-openai-transcription" }
tw-openai-compatible = { path = "crates/tw-openai-compatible" }

[profile.release]
lto = "thin"
